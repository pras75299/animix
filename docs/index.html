    />

    <script>
      (function () {
        try {
          var stored = localStorage.getItem('animix-theme');
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored || (prefersDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          /* no-op */
        }
      })();
    </script>
