version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      react-stack:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      dev-toolchain:
        patterns:
          - '@commitlint/*'
          - '@testing-library/*'
          - '@types/node'
          - '@typescript-eslint/*'
          - '@vitejs/*'
          - 'autoprefixer'
          - 'eslint'
          - 'eslint-*'
          - 'husky'
          - 'jsdom'
          - 'lint-staged'
          - 'postcss'
          - 'prettier'
          - 'tsup'
          - 'typescript'
          - 'vite'
          - 'vitest'
    labels:
      - dependencies
      - dev-toolchain

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:30'
      timezone: Asia/Kolkata
    labels:
      - dependencies
      - github-actions
